<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F49C6'/%3E%3Crect x='13' y='6' width='6' height='10' rx='1' fill='%23F5C63C'/%3E%3Crect x='13' y='16' width='6' height='10' rx='1' fill='%23A9B8FF'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2F49C6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232F49C6'/%3E%3Crect x='13' y='6' width='6' height='10' rx='1' fill='%23F5C63C'/%3E%3Crect x='13' y='16' width='6' height='10' rx='1' fill='%23A9B8FF'/%3E%3C/svg%3E">
<meta name="description" content="Six questions a day. Answer honestly, then guess how everyone else answered.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Split’em</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Layout: a rich blue ground split by a slow diagonal, butter-coloured sheets on top.
   Blue and yellow are the two sides of every split; everything else stays quiet. */
:root{
  --ground:#2F49C6; --ground-2:#2740B2; --on-ground:#FFFFFF; --on-ground-dim:rgba(255,255,255,.76);
  --sheet:#FFF8E6; --ink:#15193A; --muted:#5F6079; --line:#E9DFC6; --faint:#F7EED6;
  --a:#3451D1; --a-soft:#DAE0FA; --b:#F5C63C; --b-soft:#FBE9A8; --on-a:#FFFFFF; --on-b:#2B2203; --lo:#C4BCA4;
  --btn:#15193A; --on-btn:#FFF8E6; --scrim:rgba(12,16,46,.55); --shadow:rgba(8,12,44,.45);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Helvetica Neue',system-ui,sans-serif;
  --t-xs:12px; --t-s:14px; --t-m:16px; --t-l:20px; --t-xl:29px; --t-2xl:52px; --t-3xl:88px;
  color-scheme:light;
}
:root[data-skin="dark"]{
  --ground:#0C1026; --ground-2:#111838; --on-ground:#F3F0E4; --on-ground-dim:rgba(243,240,228,.7);
  --sheet:#181D3D; --ink:#F3F0E4; --muted:#A6A9C8; --line:#2C3364; --faint:#20264C;
  --a:#7089FF; --a-soft:#2A3570; --b:#F5C63C; --b-soft:#5B4C1B; --on-a:#0C1026; --on-b:#2B2203; --lo:#4D5486;
  --btn:#F3F0E4; --on-btn:#15193A; --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:var(--t-m);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}

/* ground */
.ground{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--ground)}
.ground::before{content:"";position:absolute;inset:-25%;background:linear-gradient(100deg,transparent 0 56%,var(--ground-2) 56% 100%);animation:sway 24s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg) translateX(-4%)}to{transform:rotate(4deg) translateX(4%)}}
.ground span{position:absolute;top:100%;font-family:var(--display);font-weight:800;color:var(--on-ground);opacity:.07;animation:drift linear infinite;white-space:nowrap}
@keyframes drift{to{transform:translateY(-140vh)}}

.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 18px}
.top{display:flex;align-items:center;gap:12px;height:68px;width:100%;max-width:980px;margin-inline:auto;padding-right:56px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.page{width:100%;max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0;padding-bottom:10px}
.page.narrow{max-width:620px}
.page.center{max-width:560px;margin-block:auto}
.page.still>*{animation:none}
.foot{width:100%;max-width:980px;margin:14px auto 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px;font-size:var(--t-xs);color:var(--on-ground-dim)}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot button{background:none;border:0;padding:4px 0;color:var(--on-ground-dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* wordmark: the "l" is a split bar */
.logo{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-.025em;display:inline-flex;align-items:baseline;line-height:1;color:var(--on-ground);background:none;border:0;padding:6px 0;cursor:pointer}
.logo i{display:inline-block;width:.15em;height:.76em;margin:0 .06em;border-radius:.04em;background:linear-gradient(var(--b) 0 50%,#A9B8FF 50% 100%)}
.streak{font-size:var(--t-xs);font-weight:600;color:var(--on-b);background:var(--b);border-radius:999px;padding:4px 10px}

.corner{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.corner.hide{opacity:0;pointer-events:none}
.menu-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sheet);box-shadow:0 8px 24px -10px var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.menu-btn:hover{transform:scale(1.06)}
.menu-btn span{width:18px;height:2px;border-radius:1px;background:var(--ink);transition:transform .25s,opacity .2s}
.menu-btn.acct{background:var(--b);color:var(--on-b);font-family:var(--display);font-weight:700;font-size:18px}
.menu-btn.acct span{width:auto;height:auto;background:none;border-radius:0;display:flex}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dhead button{width:40px;height:40px;border-radius:50%;border:0;background:var(--faint);font-size:22px;line-height:1;cursor:pointer}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--sheet);color:var(--ink);transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:4px;overflow-y:auto;box-shadow:-24px 0 60px -30px var(--shadow);
  padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px}
.drawer.open{transform:none}
.who{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--faint);margin-bottom:8px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--a);color:var(--on-a);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.who div{min-width:0;flex:1}.who b{display:block;overflow-wrap:anywhere}.who small{color:var(--muted);font-size:var(--t-xs)}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:13px 4px;text-align:left;font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer;transition:padding .15s}
.nav button:hover{padding-left:10px}
.nav button small{font-family:var(--body);font-weight:500;font-size:var(--t-xs);color:var(--muted)}
.nav button.on{color:var(--a)}

/* sheets and shared bits */
.sheet{background:var(--sheet);color:var(--ink);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:22px;min-width:0;box-shadow:0 30px 60px -36px var(--shadow)}
.page>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.page>*:nth-child(2){animation-delay:.06s}.page>*:nth-child(3){animation-delay:.12s}.page>*:nth-child(4){animation-delay:.18s}.page>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:var(--t-xl);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:var(--t-l);line-height:1.2}
.sub{color:var(--muted);max-width:52ch}
.btn{min-height:56px;padding:0 26px;border-radius:28px;border:0;background:var(--btn);color:var(--on-btn);font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -14px var(--shadow)} .btn:active{transform:scale(.98)}
.btn.ghost{background:var(--faint);color:var(--ink)}
.btn.sun{background:var(--b);color:var(--on-b)}
.btn.line{background:transparent;color:var(--on-ground);box-shadow:inset 0 0 0 2px var(--on-ground-dim)}
.btn.small{min-height:42px;padding:0 18px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.mini{background:none;border:0;padding:4px 0;font-size:var(--t-s);font-weight:600;color:var(--a);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.phead{color:var(--on-ground);display:flex;flex-direction:column;gap:8px;padding-block:6px 4px}
.phead h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
.phead p{color:var(--on-ground-dim);max-width:54ch}
.tile{background:var(--faint);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);font-weight:600;color:var(--muted)}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:var(--t-l);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chip{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}.chip.a{background:var(--a)}.chip.b{background:var(--b)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipbtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:11px 17px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.chipbtn:hover{border-color:var(--ink);transform:translateY(-1px)}
.chipbtn.quiet{border-style:dashed;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:var(--t-s);font-weight:600}
.field textarea,.field input{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--faint);padding:12px 14px;resize:vertical}
.field textarea{min-height:92px}
.field textarea:focus,.field input:focus{outline:none;border-color:var(--a)}
.note{font-size:var(--t-s);color:var(--muted)}
.lockrow{display:flex;align-items:center;gap:10px}
.lockrow .btn{flex:1;min-width:0;padding-inline:12px}
.stepb{width:56px;height:56px;border-radius:50%;border:0;background:var(--faint);font-family:var(--display);font-weight:600;font-size:24px;line-height:1;cursor:pointer;flex:none;touch-action:manipulation;transition:transform .15s}
.stepb:active{transform:scale(.9)}

/* home */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding-block:18px 26px;color:var(--on-ground)}
.hero-text{display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-ground-dim)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.6vw,72px);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--b)}
.lede{font-size:18px;color:var(--on-ground-dim);max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.status{font-size:var(--t-s);color:var(--on-ground-dim)}.status b{color:var(--on-ground);font-variant-numeric:tabular-nums}
.hero-card{gap:14px;padding:24px;transform:rotate(2.5deg);animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(2.5deg) translateY(-6px)}to{transform:rotate(1.2deg) translateY(8px)}}
.hero-card .cap{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;min-height:2.3em;text-wrap:balance}
.hero-card .bar{height:64px;border-radius:16px}
.hero-card .sa{transition:width 1.2s cubic-bezier(.3,.7,.2,1)}
.hero-card .nums{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:var(--t-l);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:10px;min-width:0;counter-increment:s}
.steps h3::before{content:counter(s) ". ";color:var(--a)}
.steps p{color:var(--muted);font-size:15px}
.ill{height:96px;border-radius:18px;background:var(--faint);display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;overflow:hidden;position:relative}
.ill .pill{width:64px;height:40px;border-radius:12px}
.ill .pill.a{background:var(--a);animation:tap 2.6s ease-in-out infinite}.ill .pill.b{background:var(--b);animation:tap 2.6s 1.3s ease-in-out infinite}
@keyframes tap{0%,18%,100%{transform:none}9%{transform:scale(.86)}}
.ill .mbar{width:100%;height:36px;border-radius:10px;background:var(--b);overflow:hidden;position:relative}
.ill .mbar i{display:block;height:100%;background:var(--a);border-right:4px solid var(--ink);animation:slide 3.2s ease-in-out infinite alternate}
@keyframes slide{from{width:28%}to{width:72%}}
.ill .plus{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.03em;animation:pop 2.4s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}18%,80%{transform:none;opacity:1}100%{transform:scale(.9);opacity:0}}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.types .tile b{font-size:17px}.types .tile p{font-size:var(--t-s);color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.two>*{display:flex;flex-direction:column;gap:14px;min-width:0}

/* play */
.sheet.play{min-height:560px}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:5px}
.dot{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dot.now{background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scaleX(.6)}}
.dot.hi{background:var(--a)} .dot.mid{background:var(--b)} .dot.lo{background:var(--lo)}
.tally{font-family:var(--display);font-weight:600;font-size:var(--t-s);font-variant-numeric:tabular-nums}
.tally.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.q{font-family:var(--display);font-weight:600;font-size:var(--t-xl);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.cmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.cmid>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.cmid>*:nth-child(2){animation-delay:.06s}.cmid>*:nth-child(3){animation-delay:.12s}.cmid>*:nth-child(4){animation-delay:.18s}.cmid>*:nth-child(5){animation-delay:.24s}
.act{display:flex;flex-direction:column;gap:10px}
.hint{font-size:var(--t-s);color:var(--muted);text-align:center;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px}
.prompt{font-weight:500}
.prompt mark,.rank em{background:linear-gradient(transparent 58%,var(--b) 58%);color:inherit;padding:0 2px;font-weight:600;font-style:normal}
:root[data-skin="dark"] .prompt mark,:root[data-skin="dark"] .rank em{background:linear-gradient(transparent 86%,var(--b) 86%)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:116px;border:0;border-radius:22px;padding:16px;font-family:var(--display);font-weight:600;font-size:23px;line-height:1.1;letter-spacing:-.01em;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.opt.a{background:var(--a);color:var(--on-a);animation:rise .4s backwards,sway-a 4s ease-in-out .5s infinite alternate}
.opt.b{background:var(--b);color:var(--on-b);animation:rise .4s .06s backwards,sway-b 4s ease-in-out .5s infinite alternate}
@keyframes sway-a{from{rotate:-1.2deg}to{rotate:.8deg}}
@keyframes sway-b{from{rotate:1.2deg}to{rotate:-.8deg}}
.opt:hover{transform:translateY(-4px) scale(1.02)} .opt:active{transform:scale(.96)}
.opts.chosen .opt{pointer-events:none}
.opts.chosen .opt.pick{transform:scale(1.08)}
.opts.chosen .opt:not(.pick){opacity:.25;transform:scale(.92)}

.readout{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.r{display:flex;flex-direction:column;gap:2px}.r.rb{align-items:flex-end;text-align:right}
.r b{font-family:var(--display);font-weight:700;font-size:var(--t-2xl);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.r b small{font-size:.5em;font-weight:600;margin-left:2px}
.r span{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-s);font-weight:600}
.splitter{position:relative;--f:.5;--g:.5;user-select:none;-webkit-user-select:none}
.splitter.live{cursor:ew-resize;touch-action:pan-y}
.splitter:focus-visible{outline:none}
.splitter:focus-visible .grip{box-shadow:0 0 0 4px var(--sheet),0 0 0 7px var(--b)}
.bar{display:flex;height:88px;border-radius:20px;overflow:hidden;background:var(--b)}
.bar .sa{width:calc(var(--f)*100%);background:var(--a)}
.splitter.static .sa{transition:width 1.15s cubic-bezier(.2,.8,.2,1)}
.grip{position:absolute;top:-8px;bottom:-8px;left:calc(var(--f)*100%);width:8px;margin-left:-4px;border-radius:4px;background:var(--ink);box-shadow:0 0 0 4px var(--sheet)}
.grip.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,55%,100%{transform:none}18%{transform:translateX(-14px)}38%{transform:translateX(14px)}}
.splitter.static{padding-top:30px}
.you-tick{position:absolute;top:22px;height:104px;left:calc(var(--g)*100%);width:2px;margin-left:-1px;background:var(--ink)}
.you-tag{position:absolute;top:0;left:clamp(34px,calc(var(--g)*100%),calc(100% - 34px));transform:translateX(-50%);font-size:var(--t-xs);font-weight:600;background:var(--ink);color:var(--sheet);border-radius:6px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.whose{font-size:var(--t-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.pv{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pv span{font-size:var(--t-s);font-weight:600;color:var(--muted)}
.pv b{font-family:var(--display);font-weight:700;font-size:var(--t-2xl);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price{position:relative;--f:.5;--l:.5;--w:0;padding:0 15px;user-select:none;-webkit-user-select:none}
.price.live{cursor:ew-resize;touch-action:pan-y}
.price:focus-visible{outline:none}
.price:focus-visible .knob{box-shadow:0 0 0 4px var(--sheet),0 0 0 7px var(--b)}
.rail{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--b-soft) 0 50%,var(--a-soft) 50% 100%);margin-block:12px}
.fill{position:absolute;top:0;bottom:0;left:calc(var(--l)*100%);width:calc(var(--w)*100%);background:var(--a);border-radius:7px}
.price.neg .fill{background:var(--b)}
.zero{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);opacity:.35}
.knob{position:absolute;top:50%;left:calc(var(--f)*100%);width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--sheet)}
.knob.nudge{animation:nudge 1.8s ease-in-out infinite}
.ticks{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

const fx = $('#fx'), ctx = fx.getContext('2d'); let parts = [], raf = 0;
function burst(x, y, n = 70) {
  if (calm()) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(root), cols = [cs.getPropertyValue('--a').trim(), cs.getPropertyValue('--b').trim(), cs.getPropertyValue('--on-ground').trim(), cs.getPropertyValue('--b').trim()];
  for (let i = 0; i < n; i++) parts.push({x, y, vx:(Math.random() - .5) * 15, vy:-Math.random() * 14 - 4, r:Math.random() * 6.28, vr:(Math.random() - .5) * .5,
    w:6 + Math.random() * 7, h:4 + Math.random() * 5, c:cols[i % cols.length], life:0, max:70 + Math.random() * 50});
  if (!raf) raf = requestAnimationFrame(loop);
}

    ctx.save(); ctx.globalAlpha = Math.min(1, (p.max - p.life) / 20); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }

}

}
function finish() {
  const G = S.game, total = sum(G.run.scores);
  if (G.daily) { S.hist[DAY] = {no:DAYNO, total, p:null, scores:G.run.scores.slice()};
    if (S.streak.last !== DAY) { const c = S.streak.last === YDAY ? S.streak.count + 1 : 1; S.streak = {count:c, last:DAY, best:Math.max(S.streak.best || 0, c)}; } }
  else if (!G.battle) S.arch[G.no] = {total, p:null, scores:G.run.scores.slice(), guesses:G.run.guesses.slice(), truths:(G.run.truths || []).slice()};
  save(); S.phase = 'done'; S.fresh = !G.battle;
}

function drawCurve(box, total, mu, sd) {
  const W = 600, H = 96, pdf = x => Math.exp(-.5 * ((x - mu) / sd) ** 2);
  let line = '', area = `M0 ${H}`;
  for (let x = 0; x <= W; x += 6) { const y = (H - 4) - (H - 10) * pdf(x); line += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1); if (x <= total) area += `L${x} ${y.toFixed(1)}`; }
  area += `L${Math.min(total, W)} ${H}Z`;
  box.innerHTML = `<div class="curve" style="--x:${Math.min(1, total / MAX)}"><div class="clip"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="var(--a-soft)"/><path d="${line}" fill="none" stroke="var(--a)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${H - 1}" x2="${W}" y2="${H - 1}" stroke="var(--line)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div><span class="me"></span></div>
    <div class="axis"><span>0</span><span>Today’s scores</span><span>${MAX}</span></div>`;
  box.hidden = false;
}

      <div class="rowline"><div><b>Calm mode</b><small>Turns off animations and confetti.</small></div><button class="switch" type="button" id="calm" role="switch" aria-checked="${!!S.prefs.calm}" aria-label="Calm mode"></button></div>
      <div class="rowline"><div><b>Account</b><small>${S.user ? 'Signed in as ' + esc(S.user.name) : 'Not signed in'}</small></div><button class="btn small ghost" type="button" data-go="profile">Open profile</button></div>
      <div class="rowline"><div><b>Erase my data</b><small>Deletes your answers, scores, name, battles and messages from our database and this browser.</small></div><button class="btn small ghost" type="button" id="wipe">Erase</button></div>
    </section></div>`;
  radios($('#theme'), v => { S.prefs.theme = v; save(); applySkin(); });
  $('#calm').onclick = e => { S.prefs.calm = !S.prefs.calm; e.currentTarget.setAttribute('aria-checked', S.prefs.calm); save(); applySkin(); };
  const wipe = $('#wipe'); let armed = false;
  wipe.onclick = async () => { if (!armed) { armed = true; wipe.textContent = 'Tap again to erase'; setTimeout(() => { armed = false; if (wipe.isConnected) wipe.textContent = 'Erase'; }, 4000); return; }
    wipe.disabled = true; wipe.textContent = 'Erasing…';
    try { await rpc('delete_me'); } catch (e) { if (ONLINE) { wipe.disabled = false; wipe.textContent = 'Erase'; toast('Could not reach the database. Nothing was erased. Try again.'); return; } }
    store.clear(); try { localStorage.removeItem('splitem.auth'); } catch (e) {}
    location.hash = ''; location.reload(); };
}

/* ---------- feedback and inbox ---------- */
function feedback() {
  stage.innerHTML = `<div class="page narrow">${phead('Feedback', 'What works, what is confusing, what you would change.')}
    <section class="sheet"><form id="fform" style="display:flex;flex-direction:column;gap:18px">
      <div class="field"><span class="lab">How is Split’em so far?</span><div class="chips" id="f-mood"><button class="chipbtn" type="button" aria-pressed="false" data-v="Love it">Love it</button><button class="chipbtn" type="button" aria-pressed="false" data-v="It is fine">It is fine</button><button class="chipbtn" type="button" aria-pressed="false" data-v="Needs work">Needs work</button></div></div>
      <div class="field"><label for="f-text">Your feedback</label><textarea id="f-text" maxlength="800" placeholder="The more specific, the better."></textarea></div>
      <button class="btn" type="submit">Send feedback</button></form></section></div>`;
  radios($('#f-mood'));
  $('#fform').addEventListener('submit', async e => { e.preventDefault(); const ta = $('#f-text'), text = ta.value.trim(), mood = $('#f-mood [aria-pressed="true"]');
    if (!text && !mood) { toast('Pick a mood or write a line first.'); return; }
    const btn = $('#fform .btn'); btn.disabled = true;
    const res = await submit('feedback', {text, mood: mood ? mood.dataset.v : ''});
    btn.disabled = false; if (res !== 'sent') return toast('Could not send it. Check your connection and try again.');
    ta.value = ''; $$('#f-mood button').forEach(b => b.setAttribute('aria-pressed', false)); toast('Sent. Thank you.'); burstAt(btn, 30); });
}
function privacy() {
  stage.innerHTML = `<div class="page narrow">${phead('Privacy')}
    <section class="sheet prose">
      <p>Split’em is a game. We keep as little about you as we can, and nothing is sold or shared for advertising.</p>
      <h3>What we store</h3>
      <ul>
        <li>A random player ID, created when you first open the site. It is not linked to your email, phone or real name.</li>
        <li>Your answers, guesses and scores, so we can show how everyone answered and run the leaderboard.</li>
        <li>Your age range, gender and continent, only if you choose to give them. They are used to group answers, for cards like “how did under-25s split?”, and are never shown next to your name.</li>
        <li>The display name you pick, which appears on the leaderboard and in battles.</li>
        <li>Question ideas and feedback you send us.</li>
      </ul>
      <h3>Where it is kept</h3>
      <p>The database runs on Supabase and the website on Vercel. Your settings, streak and game progress are also saved in your own browser.</p>
      <h3>How long</h3>
      <p>Until you delete it. Settings → Erase my data removes everything we hold about you at once, from the database and your browser.</p>
      <h3>Your rights</h3>
      <p>Under the GDPR you can see, correct or delete your data. Erase my data deletes it straight away. For anything else, write to us through the feedback page.</p>
      <h3>Cookies</h3>
      <p>We use no tracking cookies. The site stores your player ID and settings in your browser so your game carries on next time.</p>
    </section></div>`;
}

/* ---------- battle ---------- */
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => Array.from({length:4}, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
const validKeys = k => Array.isArray(k) && k.length === CARDS && k.every(x => KEYQ[x]);
function pickKeys() {
  const pool = {split:[], price:[], group:[]};
  SETS.forEach((set, si) => { if (si >= DAILY) set.forEach(q => pool[q.t].push(q.key)); });
  const take = a => a.splice(Math.floor(Math.random() * a.length), 1)[0];
  return ['split','price','group','split','price','group'].map(t => take(pool[t]));
}
async function createBattle() {
  if (!S.user) return signIn(createBattle);
  const btn = $('#bt-new'); if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  const qkeys = pickKeys();
  for (let i = 0; i < 4; i++) {
    const code = newCode();
    try { await rpc('create_battle', {p_code: code, p_qkeys: qkeys});
      S.bt = {code, qkeys, my: {answers:[], guesses:[], scores:[], truths:[]}, rows:[]}; save(); return go('battle'); }
    catch (e) { if (!ONLINE || String(e.message || '').includes('timeout')) break; }
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Start a battle'; }
  toast('Battles need a connection. Try again in a moment.');
}
async function joinBattle(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) return toast('Battle codes have four letters.');
  if (!S.user) return signIn(() => joinBattle(code));
  let qkeys;
  try { qkeys = await rpc('join_battle', {p_code: code}); } catch (e) { return toast('Battles need a connection. Try again in a moment.'); }
  if (!qkeys) return toast('No battle with the code ' + code + '.');
  if (!validKeys(qkeys)) return toast('That battle could not be opened. Try updating the page.');
  S.bt = {code, qkeys, my: S.bt && S.bt.code === code ? S.bt.my : {answers:[], guesses:[], scores:[], truths:[]}, rows:[]};
  save(); go('battle');
}
async function refreshBattle() {
  const b = S.bt; if (!b) return;
  try {
    const rows = await rpc('battle_standings', {p_code: b.code});
    if (S.bt !== b) return;
    b.rows = Array.isArray(rows) ? rows : [];
    const me = b.rows.find(r => r.me);
    if (me && me.scores.length > b.my.scores.length) {
      b.my.scores = me.scores.slice(); b.my.guesses = me.scores.map((_, i) => b.my.guesses[i] ?? null); b.my.answers = me.scores.map((_, i) => b.my.answers[i] ?? null); save();
    }
    b.err = false;
  } catch (e) { b.err = true; }
  drawStandings();
}
function drawStandings() {
  const list = $('#bt-list'), b = S.bt; if (!list || S.view !== 'battle' || !b) return;
  const rows = (b.rows.length ? b.rows : [{name:'You', me:true, scores:b.my.scores}]).map(r => ({name: r.me && S.user ? S.user.name : r.name, me: r.me, scores: r.scores, total: sum(r.scores)}));
  rows.sort((x, y) => y.total - x.total);
  const fin = rows.filter(r => r.scores.length >= CARDS).length, all = rows.length > 1 && fin === rows.length;
  list.innerHTML = rows.map((r, i) => `<li class="${r.me ? 'me' : ''}"><span class="n">${i + 1}</span><span class="nm">${esc(r.name)}${r.me ? '<small class="tag">you</small>' : ''}
    <span class="sqs">${Array.from({length:CARDS}, (_, k) => `<i class="${r.scores[k] === undefined ? 'p' : tier(r.scores[k])}"></i>`).join('')}</span></span><span class="s">${r.total}</span></li>`).join('');
  $('#bt-status').textContent = b.err && !b.rows.length ? 'Could not load the other players. Check your connection.'
    : rows.length === 1 ? 'Waiting for friends to join. Send them the code.'
    : all ? (rows[0].me ? 'You win with ' + rows[0].total + ' points.' : rows[0].name + ' wins with ' + rows[0].total + ' points.')
    : `${rows.length} players, ${fin} finished.`;
  if (all && rows[0].me && !b.cele) { b.cele = true; setTimeout(() => { burst(innerWidth * .3, innerHeight * .4, 70); burst(innerWidth * .7, innerHeight * .4, 70); }, 400); }
}
function battle() {
  const b = S.bt;
  if (!b) {
    stage.innerHTML = `<div class="page narrow">${phead('Battle', 'Play the same six cards as your friends and see who reads the crowd best.')}
      <section class="sheet"><div class="two">
        <div><h3>Start a battle</h3><p class="sub">You get a four-letter code to send to your friends. Everyone plays the same six cards, in their own time.</p><button class="btn" type="button" id="bt-new">Start a battle</button></div>
        <form id="bt-join"><h3>Join a battle</h3><div class="field"><label for="bt-code">Battle code</label><input id="bt-code" class="codein" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></div><button class="btn ghost" type="submit">Join</button></form>
      </div><p class="note">Battles use their own cards, so they never spoil today’s six. They do not count toward your streak.</p></section></div>`;
    $('#bt-new').onclick = createBattle;
    $('#bt-join').addEventListener('submit', e => { e.preventDefault(); joinBattle($('#bt-code').value); });
    return;
  }
  const n = b.my.scores.length;
  stage.innerHTML = `<div class="page narrow">${phead('Battle')}
    <section class="sheet">
      <div class="set-head"><div><p class="whose">Battle code</p><div class="code">${esc(b.code)}</div></div><button class="btn small ghost" type="button" id="bt-invite">Copy invite</button></div>
      <p class="rank" id="bt-status">Loading players…</p>
      <ol class="board" id="bt-list"></ol>
      <div class="actions"><button class="btn wide" type="button" id="bt-play">${n === 0 ? 'Play your six' : n < CARDS ? 'Continue, card ' + (n + 1) + ' of ' + CARDS : 'See your cards'}</button>
        <button class="btn ghost wide" type="button" id="bt-leave">Leave battle</button></div>
      <p class="note">Friends join with the code on Split’em. The standings update by themselves.</p>
    </section></div>`;
  drawStandings(); refreshBattle(); every(refreshBattle, 8000);
  $('#bt-invite').onclick = e => copyText(`Battle me on Split’em: splitem-blush.vercel.app — code ${b.code}`, e.currentTarget);
  $('#bt-play').onclick = () => { S.game = {no:0, battle:b.code, daily:false, mode:'battle', ref:b.code, qs:b.qkeys.map(k => KEYQ[k]), run:b.my};
    S.cur = b.my.scores.length; S.phase = S.cur >= CARDS ? 'done' : 'answer'; S.tmp = null; S.onb = S.profile ? null : {step:0, tmp:{}, then:'play'}; go('play'); };
  $('#bt-leave').onclick = () => { S.bt = null; save(); if (S.game && S.game.battle) S.game = null; render(); };
}

/* ---------- day change ---------- */
function newDay() {
  setDay(); S.run = {day:DAY, answers:[], guesses:[], scores:[]};
  if (S.game && S.game.daily) S.game = null;
  save(); drawNav(); go(S.view === 'play' ? 'home' : S.view);
}
function dayCheck() {
  if (dkey(new Date()) === DAY) return false;
  if (S.view !== 'play') newDay();
  else if (S.game && S.game.daily && S.phase === 'done' && !$('#newday')) render();
  return true;
}

/* ---------- boot ---------- */
load(); applySkin(); drawNav();
{ const h = location.hash.slice(1); if (ROUTES.includes(h)) S.view = h; }
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
setInterval(dayCheck, 30000);
})();
</script>
